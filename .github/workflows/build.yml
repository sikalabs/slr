name: "Try to build it"

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: build --snapshot --skip before

      - name: upload latest builds (on master)
        if: github.ref == 'refs/heads/master'
        env:
          SLR_SIKALABS_UPLOAD_BIN_ACCESS_KEY: ${{ secrets.SLR_SIKALABS_UPLOAD_BIN_ACCESS_KEY }}
          SLR_SIKALABS_UPLOAD_BIN_SECRET_KEY: ${{ secrets.SLR_SIKALABS_UPLOAD_BIN_SECRET_KEY }}
        run: |
          curl -O https://sikalabs.fra1.digitaloceanspaces.com/bin/upload-sikalabs-bin-linux-amd64
          chmod +x upload-sikalabs-bin-linux-amd64

          cp dist/slr_linux_amd64_v1/slr slr
          cp dist/slr_linux_amd64_v1/slr slr-linux-amd64
          ./upload-sikalabs-bin-linux-amd64 slr
          ./upload-sikalabs-bin-linux-amd64 slr-linux-amd64

          cp dist/slr_darwin_arm64_v8.0/slr slr-darwin-arm64
          ./upload-sikalabs-bin-linux-amd64 slr-darwin-arm64
